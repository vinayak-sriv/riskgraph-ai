name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      RISKGRAPH_ANALYZER_SERVICE_TOKEN: ci-analyzer-contract-only-not-a-secret
      RISKGRAPH_GRAPH_SERVICE_TOKEN: ci-graph-contract-only-not-a-secret
      RISKGRAPH_AI_SERVICE_TOKEN: ci-ai-contract-only-not-a-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: ruff check services/graph-risk-service services/ai-validation-service services/python-analyzer tests tools datasets/risk-corpus/tools
      - run: ruff format --check services/graph-risk-service services/ai-validation-service services/python-analyzer tests tools datasets/risk-corpus/tools
      - run: python -m pytest tests -q --cov=services/graph-risk-service/app --cov=services/ai-validation-service/app --cov=services/python-analyzer/app --cov-branch --cov-fail-under=93
      # One run per service: all three have a package named `app`.
      - run: |
          for service in graph-risk-service ai-validation-service python-analyzer; do
            python -m mypy "services/$service/app"
          done
      # Regenerating proves the generator still works AND that the committed
      # contracts are current. Both were previously unchecked.
      - run: python tools/dev/export_contracts.py
      - run: git diff --exit-code contracts/
      - run: mvn -f services/java-analyzer/pom.xml clean verify
      - run: mvn -f services/platform-api/pom.xml clean verify
      - run: docker compose -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.validation.yml --profile app config --quiet
      - run: npm ci
        working-directory: apps/dashboard
      - run: npm run build
        working-directory: apps/dashboard
      - run: npm run lint
        working-directory: apps/dashboard
      - run: npm run format:check
        working-directory: apps/dashboard
      - run: npm test
        working-directory: apps/dashboard
      - run: npm run test:coverage
        working-directory: apps/dashboard
      - run: npx playwright install --with-deps chromium
        working-directory: apps/dashboard
      - run: npm run test:e2e
        working-directory: apps/dashboard
      - run: npm run demo:record
        working-directory: apps/dashboard
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: riskgraph-demo-recording
          path: |
            dist/riskgraph-demo.webm
            dist/riskgraph-demo.manifest.json
          if-no-files-found: error
          retention-days: 14
      - run: npm audit --omit=dev
        working-directory: apps/dashboard

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RISKGRAPH_ANALYZER_SERVICE_TOKEN: ci-analyzer-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      RISKGRAPH_GRAPH_SERVICE_TOKEN: ci-graph-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      RISKGRAPH_AI_SERVICE_TOKEN: ci-ai-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      RISKGRAPH_VALIDATION_PROBE_IMAGE: python:3.12.14-alpine3.24@sha256:b64631e04e4920160c50fbe8d8df828f7f35f06f425cb44aa09bca53e708a35a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Generate isolated test repositories and credentials
        run: |
          python tools/dev/create_mvp_samples.py
          python tools/dev/init_auth.py
      - name: Prebuild trusted validation images for the isolated daemon
        run: python tools/dev/build_sandboxes.py
      - name: Build and start the complete isolated stack
        run: docker compose -p riskgraph-ci -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.validation.yml --profile app up -d --build --wait
      - name: Exercise source, graph, AI-degraded, validation, and decision stages
        run: python tools/dev/verify_mvp.py --compose --validation
      - name: Reject critical vulnerabilities in built application images
        run: |
          mkdir -p tmp/trivy-cache
          scan_status=0
          image_ids=$(
            {
              docker compose -p riskgraph-ci -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.validation.yml --profile app images -q
              for validation_image in riskgraph-sandbox-protected:local riskgraph-sandbox-vulnerable:local riskgraph-sandbox:local "$RISKGRAPH_VALIDATION_PROBE_IMAGE"; do
                docker image inspect --format '{{.Id}}' "$validation_image"
              done
            } | sort -u
          )
          for image_id in $image_ids; do
            image_name=$(docker image inspect --format '{{if .RepoTags}}{{join .RepoTags ", "}}{{else}}{{.Id}}{{end}}' "$image_id")
            printf '::group::Trivy scan: %s\n' "$image_name"
            if ! docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/tmp/trivy-cache:/root/.cache/trivy" \
              aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
              image --exit-code 1 --ignore-unfixed --severity CRITICAL "$image_id"; then
              scan_status=1
            fi
            printf '::endgroup::\n'
          done
          exit "$scan_status"
      - name: Capture service logs on failure
        if: failure()
        run: docker compose -p riskgraph-ci -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.validation.yml --profile app logs --no-color
      - name: Stop and remove the disposable stack
        if: always()
        run: docker compose -p riskgraph-ci -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.validation.yml --profile app down -v --remove-orphans

  release-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Scan source for secrets and high-impact configuration errors
        # Dependency/OS vulnerability scanning happens against the built images in
        # container-smoke. Keeping this source scan offline avoids Maven Central
        # rate limits without reducing the shipped-image gate.
        run: docker run --rm -v "$PWD:/workspace" -w /workspace aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 fs --offline-scan --ignorefile .trivyignore.yaml --exit-code 1 --severity HIGH,CRITICAL --scanners secret,misconfig .
      - name: Build and independently verify deterministic release archive
        run: python tools/release/package.py --output dist/riskgraph-source.zip --manifest dist/riskgraph-source.manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: riskgraph-release-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 14
