# Optional CPU-only local AI backend. No hosted credentials or GPU required.
services:
  ollama:
    image: ollama/ollama@sha256:32931b46719f673c05fdbaa81ccb26da18ea4a1c57590a754874ab28ba269eb2
    profiles: ["ollama"]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_CONTEXT_LENGTH: 2048
      OLLAMA_KEEP_ALIVE: 60s
      OLLAMA_NO_CLOUD: 1
    ports: ["127.0.0.1:11434:11434"]
    volumes: [riskgraph-ollama-models:/root/.ollama]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    cpus: 2
    pids_limit: 128
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-validation-service:
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      # Small model for constrained demo hosts; use a larger model when RAM permits.
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}

volumes:
  riskgraph-ollama-models:
