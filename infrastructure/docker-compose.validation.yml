# Opt-in validation worker backed by a disposable Docker-in-Docker daemon. The
# host Docker socket is deliberately not mounted into an application container.
services:
  validation-docker:
    image: docker:29.8.0-dind@sha256:5efed980cba3fc126cf54e21a5a6ff8849d05b6e0623d6e7612f48e9cd6cd17e
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["--tls=false", "--host=tcp://0.0.0.0:2375", "--host=unix:///var/run/docker.sock"]
    volumes:
      - riskgraph-validation-docker:/var/lib/docker
    networks:
      validation-engine: {}
      validation-egress:
        gw_priority: 1
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1536m
    cpus: 2.0
    pids_limit: 256

  validation-image-loader:
    image: docker:29.8.0-cli@sha256:eccaacfeed644c7de222ff047483568cb988dde95476fbaaf10ea2d04921bb66
    depends_on:
      validation-docker:
        condition: service_healthy
    environment:
      DOCKER_HOST: tcp://validation-docker:2375
      RISKGRAPH_VALIDATION_PROBE_IMAGE: ${RISKGRAPH_VALIDATION_PROBE_IMAGE:-python:3.12.14-alpine3.24@sha256:b64631e04e4920160c50fbe8d8df828f7f35f06f425cb44aa09bca53e708a35a}
    working_dir: /workspace
    volumes:
      - ../samples:/workspace/samples:ro
      - ../tmp/validation-images:/workspace/preloaded:ro
    command:
      - sh
      - -ec
      - |
        case "$${RISKGRAPH_VALIDATION_PROBE_IMAGE}" in
          python:3.12.14-alpine3.24@sha256:b64631e04e4920160c50fbe8d8df828f7f35f06f425cb44aa09bca53e708a35a) ;;
          *) echo "Unapproved validation probe image" >&2; exit 64 ;;
        esac
        if [ -f /workspace/preloaded/images.tar ]; then
          test -f /workspace/preloaded/images.sha256
          expected_archive_sha="$$(cat /workspace/preloaded/images.sha256)"
          echo "$${expected_archive_sha}" | grep -Eq '^[0-9a-f]{64}$'
          actual_archive_sha="$$(sha256sum /workspace/preloaded/images.tar | cut -d ' ' -f 1)"
          test "$${actual_archive_sha}" = "$${expected_archive_sha}"
          docker load --input /workspace/preloaded/images.tar
        else
          docker build --tag riskgraph-sandbox-protected:local samples/generated/build-protected
          docker build --tag riskgraph-sandbox-vulnerable:local samples/generated/build-vulnerable
          docker build --tag riskgraph-sandbox:local samples/sandbox
          docker build --tag riskgraph-sandbox-protected-py:local samples/generated/build-protected-py
          docker build --tag riskgraph-sandbox-vulnerable-py:local samples/generated/build-vulnerable-py
          docker pull "$${RISKGRAPH_VALIDATION_PROBE_IMAGE}"
          docker image tag "$${RISKGRAPH_VALIDATION_PROBE_IMAGE}" riskgraph-validation-probe:local
        fi
        docker image inspect riskgraph-sandbox-protected:local >/dev/null
        docker image inspect riskgraph-sandbox-vulnerable:local >/dev/null
        docker image inspect riskgraph-sandbox:local >/dev/null
        docker image inspect riskgraph-sandbox-protected-py:local >/dev/null
        docker image inspect riskgraph-sandbox-vulnerable-py:local >/dev/null
        docker image inspect riskgraph-validation-probe:local >/dev/null
    networks: [validation-engine]
    restart: "no"

  ai-validation-service:
    build:
      context: ../services/ai-validation-service
      dockerfile: Dockerfile.validation
    depends_on:
      validation-docker:
        condition: service_healthy
      validation-image-loader:
        condition: service_completed_successfully
    environment:
      RISKGRAPH_VALIDATION_DOCKER_HOST: tcp://validation-docker:2375
      RISKGRAPH_REQUIRE_ISOLATED_DOCKER: "true"
      RISKGRAPH_VALIDATION_PROBE_IMAGE: riskgraph-validation-probe:local
    networks:
      - default
      - validation-engine

networks:
  validation-engine:
    internal: true
  validation-egress: {}

volumes:
  riskgraph-validation-docker:
