server:
  port: 8081

spring:
  application:
    name: java-analyzer

riskgraph:
  analyzer:
    # No default: an unset allowlist must fail startup, not silently widen to
    # the working directory. Matches the fail-closed service-token behaviour.
    allowed-repository-roots: ${RISKGRAPH_ALLOWED_REPOSITORY_ROOTS:}
    max-java-files: ${RISKGRAPH_MAX_JAVA_FILES:5000}
    max-java-file-bytes: ${RISKGRAPH_MAX_JAVA_FILE_BYTES:2097152}
    max-total-java-bytes: ${RISKGRAPH_MAX_TOTAL_JAVA_BYTES:52428800}
    max-analysis-seconds: ${RISKGRAPH_MAX_ANALYSIS_SECONDS:60}
    max-concurrent-analyses: ${RISKGRAPH_MAX_CONCURRENT_ANALYSES:2}
    max-queued-analyses: ${RISKGRAPH_MAX_QUEUED_ANALYSES:4}
    process-isolation: ${RISKGRAPH_ANALYZER_PROCESS_ISOLATION:false}
    executable-jar: ${RISKGRAPH_ANALYZER_EXECUTABLE_JAR:}
    sensitivity-policy: ${RISKGRAPH_SENSITIVITY_POLICY:}
    temp-cleanup-minimum-age-hours: ${RISKGRAPH_TEMP_CLEANUP_MINIMUM_AGE_HOURS:24}
    temp-cleanup-max-candidates: ${RISKGRAPH_TEMP_CLEANUP_MAX_CANDIDATES:100}
    temp-cleanup-delay-ms: ${RISKGRAPH_TEMP_CLEANUP_DELAY_MS:3600000}
    temp-cleanup-initial-delay-ms: ${RISKGRAPH_TEMP_CLEANUP_INITIAL_DELAY_MS:60000}
    snapshot-cache-root: ${RISKGRAPH_SNAPSHOT_CACHE_ROOT:}
    snapshot-cache-max-entries: ${RISKGRAPH_SNAPSHOT_CACHE_MAX_ENTRIES:32}
    snapshot-cache-max-bytes: ${RISKGRAPH_SNAPSHOT_CACHE_MAX_BYTES:1073741824}
    snapshot-cache-max-age-hours: ${RISKGRAPH_SNAPSHOT_CACHE_MAX_AGE_HOURS:24}
    extraction-cache-max-entries: ${RISKGRAPH_EXTRACTION_CACHE_MAX_ENTRIES:64}

management:
  endpoints:
    web:
      exposure:
        include: health,info
