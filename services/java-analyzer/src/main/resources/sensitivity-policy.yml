version: "1.1.0"
default_sensitivity: MODERATE
unmatched_repository_sensitivity: MEDIUM
rules:
  - id: Account
    sensitivity: HIGH
    exact: Account
    prefix: Account
  - id: Admin
    sensitivity: HIGH
    exact: Admin
    prefix: Admin
  - id: Credential
    sensitivity: CRITICAL
    exact: Credential
    suffix: [Credential, Credentials, CredentialStore]
  - id: Customer
    sensitivity: HIGH
    exact: Customer
    prefix: Customer
  - id: Payment
    sensitivity: CRITICAL
    exact: Payment
    prefix: Payment
  - id: Secret
    sensitivity: CRITICAL
    exact: Secret
    prefix: Secret
    suffix: [Secret, Secrets]
  - id: Token
    sensitivity: CRITICAL
    exact: Token
    suffix: [Token, Tokens]
  - id: User
    sensitivity: HIGH
    exact: User
    prefix: User
