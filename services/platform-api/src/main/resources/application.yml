server:
  port: 8080
  tomcat:
    threads:
      # Keep request threads within range of what the connection pool can serve.
      max: ${RISKGRAPH_HTTP_THREADS:50}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${RISKGRAPH_SECURE_COOKIE:true}

spring:
  application:
    name: platform-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/riskgraph}
    username: ${POSTGRES_USER:riskgraph}
    password: ${POSTGRES_PASSWORD}
    hikari:
      # Default pool is 10 against Tomcat's 200 request threads, and the
      # advisory-locked scan writes hold a connection for a whole transaction.
      maximum-pool-size: ${RISKGRAPH_DB_POOL_SIZE:20}
      minimum-idle: 2
      # Fail fast instead of queueing 30s behind a saturated pool.
      connection-timeout: 3000
      leak-detection-threshold: 20000
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:riskgraph-oauth-disabled}
            client-secret: ${GITHUB_CLIENT_SECRET:riskgraph-oauth-disabled}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: GitHub

management:
  endpoints:
    web:
      exposure:
        include: health,info

riskgraph:
  scan-jobs:
    workers: ${RISKGRAPH_SCAN_JOB_WORKERS:2}
    queue-capacity: ${RISKGRAPH_SCAN_JOB_QUEUE_CAPACITY:8}
  enrichment:
    workers: ${RISKGRAPH_ENRICHMENT_WORKERS:4}
    queue-capacity: ${RISKGRAPH_ENRICHMENT_QUEUE_CAPACITY:16}
  demo:
    dynamic-enabled: ${RISKGRAPH_DYNAMIC_DEMO_ENABLED:false}
  services:
    graph-risk-base-url: ${GRAPH_RISK_BASE_URL:http://localhost:8082}
  web:
    allowed-origin: ${DASHBOARD_ORIGIN:http://localhost:5173}
    allowed-origins: ${DASHBOARD_ALLOWED_ORIGINS:${DASHBOARD_ORIGIN:http://localhost:5173},http://127.0.0.1:5173}
  github:
    client-id: ${GITHUB_CLIENT_ID:riskgraph-oauth-disabled}
    client-secret: ${GITHUB_CLIENT_SECRET:riskgraph-oauth-disabled}
  notifications:
    poll-interval-ms: ${RISKGRAPH_NOTIFICATION_POLL_INTERVAL_MS:5000}
    email:
      # EMAIL deliveries fail with a clear reason (not silently dropped) until
      # spring.mail.host is set (standard Spring Boot SMTP config, e.g. via
      # SPRING_MAIL_HOST/SPRING_MAIL_USERNAME/SPRING_MAIL_PASSWORD env vars).
      from: ${RISKGRAPH_NOTIFICATION_EMAIL_FROM:notifications@riskgraph.local}
