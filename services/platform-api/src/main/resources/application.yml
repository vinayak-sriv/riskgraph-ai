server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${RISKGRAPH_SECURE_COOKIE:false}

spring:
  application:
    name: platform-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/riskgraph}
    username: ${POSTGRES_USER:riskgraph}
    password: ${POSTGRES_PASSWORD:riskgraph_dev_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:riskgraph-oauth-disabled}
            client-secret: ${GITHUB_CLIENT_SECRET:riskgraph-oauth-disabled}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: GitHub

management:
  endpoints:
    web:
      exposure:
        include: health,info

riskgraph:
  services:
    graph-risk-base-url: ${GRAPH_RISK_BASE_URL:http://localhost:8082}
  web:
    allowed-origin: ${DASHBOARD_ORIGIN:http://localhost:5173}
    allowed-origins: ${DASHBOARD_ALLOWED_ORIGINS:${DASHBOARD_ORIGIN:http://localhost:5173},http://127.0.0.1:5173}
  github:
    client-id: ${GITHUB_CLIENT_ID:riskgraph-oauth-disabled}
    client-secret: ${GITHUB_CLIENT_SECRET:riskgraph-oauth-disabled}
