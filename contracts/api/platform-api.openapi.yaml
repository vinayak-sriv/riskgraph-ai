openapi: 3.1.0
info:
  title: RiskGraph Platform API
  version: 2.0.0
  description: Source and account APIs require a platform session. POST operations
    also require the CSRF token returned by /auth/csrf. The endpoint IR remains compatible;
    source envelopes are 1.1.0 and scan results are 1.2.0.
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Platform API is healthy
        '403':
          description: Insufficient role, disallowed origin, or invalid CSRF token
      security: []
  /scans:
    post:
      summary: Submit a bounded asynchronous scan job
      parameters:
      - in: header
        name: X-CSRF-TOKEN
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScanRequest'
      responses:
        '202':
          description: Job accepted or an identical reusable job returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateScanResponse'
        '401':
          description: Authentication required
        '403':
          description: Insufficient role, disallowed origin, or invalid CSRF token
        '413':
          description: Canonical graph input exceeds 2,000 rows in either revision
        '429':
          description: Bounded scan-job queue is saturated
    get:
      summary: List cursor-paginated scan jobs visible to the current member
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Membership-filtered scan history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanHistory'
        '401':
          description: Authentication required
        '403':
          description: Insufficient role, disallowed origin, or invalid CSRF token
  /scan-jobs/{jobId}:
    get:
      summary: Read owned or shared scan-job status
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Persistent job state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanJob'
        '403':
          description: Insufficient role, disallowed origin, or invalid CSRF token
        '401':
          description: Authentication required
    delete:
      summary: Cancel an owned running or queued job
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: X-CSRF-TOKEN
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Terminal or cancelled job state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanJob'
        '403':
          description: Cancellation denied
  /scan-jobs/{jobId}/result:
    get:
      summary: Read the canonical result referenced by a completed job
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Versioned deterministic scan result
          content:
            application/json:
              schema:
                $ref: ../ir/scan-result.schema.json
        '409':
          description: Job is not completed
        '401':
          description: Authentication required
        '403':
          description: Insufficient role, disallowed origin, or invalid CSRF token
  /scans/{scanId}:
    get:
      summary: Read scan status and result
      parameters:
      - name: scanId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Scan result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResult'
        '401':
          description: Authentication required
        '403':
          description: Insufficient role, disallowed origin, or invalid CSRF token
  /demo/authorization-removal:
    get:
      summary: Run the canonical authorization-removal mentor demo
      responses: &id004
        '200':
          description: Deterministic graph, risk, and verdict result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoAnalysisResult'
        '502':
          description: Graph risk service is unavailable
        '403':
          description: Insufficient role, disallowed origin, or invalid CSRF token
      security: []
  /analyses:
    post:
      summary: Analyze an allowlisted local immutable commit pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - repository_path
              - old_commit
              - new_commit
              properties:
                repository_path:
                  type: string
                  minLength: 1
                old_commit:
                  type: string
                  pattern: ^[0-9a-fA-F]{40}$
                new_commit:
                  type: string
                  pattern: ^[0-9a-fA-F]{40}$
                pull_request_number:
                  type: integer
                  minimum: 1
                pull_request_url:
                  type: string
                  pattern: ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/pull/[1-9][0-9]*$
      responses:
        '200': &id002
          description: Versioned deterministic scan with provenance and optional unconfirmed
            AI
          content:
            application/json:
              schema:
                $ref: ../ir/scan-result.schema.json
        '400': &id001
          description: Structured failure; never implies ALLOW
        '403':
          description: Insufficient role, disallowed origin, or invalid CSRF token
        '502': *id001
        '503': *id001
        '504': *id001
        '401':
          description: Authentication required
      parameters:
      - in: header
        name: X-CSRF-TOKEN
        required: true
        schema:
          type: string
  /analyses/{id}:
    get:
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200': *id002
        '404': *id001
        '401':
          description: Authentication required
        '403':
          description: Insufficient role, disallowed origin, or invalid CSRF token
  /analyses/{id}/sandbox-demonstration/{revision}:
    post:
      summary: Run the shipped synthetic sandbox separately from source confirmation
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: path
        name: revision
        required: true
        schema:
          type: string
      - in: header
        name: X-CSRF-TOKEN
        required: true
        schema:
          type: string
      responses:
        '200': *id002
        '400': *id001
        '401':
          description: Authentication required
        '403':
          description: Insufficient role, disallowed origin, or invalid CSRF token
  /analyses/{id}/access:
    post:
      summary: Explicitly grant per-scan view or validation access
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: header
        name: X-CSRF-TOKEN
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - username
              - access
              properties:
                username:
                  type: string
                  pattern: ^[a-z][a-z0-9_.-]{2,63}$
                access:
                  type: string
                  enum:
                  - VIEW
                  - VALIDATE
      responses:
        '200':
          description: Access granted
        '400': &id003
          description: Structured failure; never implies ALLOW
        '401':
          description: Authentication required
        '403':
          description: Insufficient role, disallowed origin, or invalid CSRF token
        '404': *id003
  /demo/scenarios/{scenario}:
    get:
      parameters:
      - in: path
        name: scenario
        required: true
        schema:
          type: string
      responses: *id004
      security: []
  /analyses/{id}/validation:
    post:
      summary: Validate a registered source-bound Docker fixture
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: header
        name: X-CSRF-TOKEN
        required: true
        schema:
          type: string
      responses:
        '200': *id002
        '400': *id001
        '401':
          description: Authentication required
        '403':
          description: Insufficient role, disallowed origin, or invalid CSRF token
  /auth/csrf:
    get:
      security: []
      summary: Start/reuse session and obtain CSRF token
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - headerName
                - token
                properties:
                  headerName:
                    const: X-CSRF-TOKEN
                  token:
                    type: string
        '403':
          description: Insufficient role, disallowed origin, or invalid CSRF token
  /auth/session:
    get:
      security: []
      summary: Read current account; anonymous sessions return authenticated=false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - authenticated
                properties:
                  authenticated:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/PlatformAccount'
        '403':
          description: Insufficient role, disallowed origin, or invalid CSRF token
  /auth/github/connect:
    get:
      security: []
      summary: Start GitHub App user authorization and optionally link the current
        local account
      responses:
        '302':
          description: Redirect to Spring Security's GitHub authorization endpoint
        '503':
          description: GitHub client ID or client secret is not configured
        '403':
          description: Insufficient role, disallowed origin, or invalid CSRF token
  /auth/login:
    post:
      security: []
      summary: Sign in; fetch a fresh CSRF token after success
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - username
              - password
              properties:
                username:
                  type: string
                password:
                  type: string
                  writeOnly: true
      responses:
        '200':
          description: Signed in; session ID rotated
        '401':
          description: Invalid credentials
        '429':
          description: Too many failed login attempts; retry later
        '403':
          description: Insufficient role, disallowed origin, or invalid CSRF token
      parameters:
      - in: header
        name: X-CSRF-TOKEN
        required: true
        schema:
          type: string
  /auth/logout:
    post:
      summary: Invalidate session
      responses:
        '200':
          description: Signed out
        '401':
          description: Authentication required
        '403':
          description: Insufficient role, disallowed origin, or invalid CSRF token
      parameters:
      - in: header
        name: X-CSRF-TOKEN
        required: true
        schema:
          type: string
  /admin/users:
    get:
      summary: List accounts (Admin only)
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlatformAccount'
        '401':
          description: Authentication required
        '403':
          description: Insufficient role, disallowed origin, or invalid CSRF token
    post:
      summary: Create account (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPlatformAccount'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformAccount'
        '400': *id001
        '409':
          description: Username already exists
        '401':
          description: Authentication required
        '403':
          description: Insufficient role, disallowed origin, or invalid CSRF token
      parameters:
      - in: header
        name: X-CSRF-TOKEN
        required: true
        schema:
          type: string
components:
  schemas:
    GithubConnection:
      type: object
      additionalProperties: false
      required:
      - status
      - permissions
      properties:
        status:
          type: string
          enum:
          - NOT_CONFIGURED
          - DISCONNECTED
          - CONNECTED
          - ERROR
        login:
          type:
          - string
          - 'null'
        permissions:
          type: array
          items:
            type: string
        message:
          type:
          - string
          - 'null'
    CreateScanRequest:
      type: object
      additionalProperties: false
      required:
      - repository
      - old_commit
      - new_commit
      properties:
        repository:
          type: string
          minLength: 1
        old_commit:
          type: string
          pattern: ^[0-9a-fA-F]{40}$
        new_commit:
          type: string
          pattern: ^[0-9a-fA-F]{40}$
    CreateScanResponse:
      type: object
      additionalProperties: false
      required:
      - job_id
      - status
      - reused
      properties:
        job_id:
          type: string
          format: uuid
        scan_id:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - PENDING
          - RUNNING
          - COMPLETE
          - DEGRADED
          - FAILED
        reused:
          type: boolean
    ScanJob:
      type: object
      additionalProperties: false
      required:
      - job_id
      - status
      - stage
      - progress
      - created_at
      - updated_at
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - COMPLETED
          - FAILED
          - CANCELLED
        stage:
          type: string
        progress:
          type: integer
          minimum: 0
          maximum: 100
        reason_code:
          type:
          - string
          - 'null'
        scan_id:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ScanHistory:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            type: object
            required:
            - job_id
            - repository
            - old_commit
            - new_commit
            - status
            - updated_at
            properties:
              job_id:
                type: string
                format: uuid
              scan_id:
                type:
                - string
                - 'null'
              repository:
                type: string
              old_commit:
                type: string
              new_commit:
                type: string
              status:
                type: string
              risk_delta:
                type:
                - integer
                - 'null'
              verdict:
                type:
                - string
                - 'null'
              updated_at:
                type: string
                format: date-time
        next_cursor:
          type:
          - string
          - 'null'
    ScanResult:
      type: object
      additionalProperties: false
      required:
      - scan_id
      - status
      - decision
      - risk_before
      - risk_after
      - risk_delta
      - findings
      properties:
        scan_id:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - RUNNING
          - COMPLETE
          - DEGRADED
          - FAILED
        decision:
          type:
          - string
          - 'null'
          enum:
          - ALLOW
          - REVIEW
          - BLOCK
          - null
        risk_before:
          type: integer
          minimum: 0
          maximum: 100
        risk_after:
          type: integer
          minimum: 0
          maximum: 100
        risk_delta:
          type: integer
          minimum: -100
          maximum: 100
        findings:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - type
            - severity
            - description
            - finding_id
            properties:
              type:
                type: string
              severity:
                type: string
                enum:
                - LOW
                - MODERATE
                - MEDIUM
                - HIGH
                - CRITICAL
              description:
                type: string
              finding_id:
                type: string
                pattern: ^[0-9a-f]{64}$
    DemoAnalysisResult:
      $ref: ../ir/demo-result.schema.json
    PlatformAccount:
      type: object
      required:
      - username
      - name
      - role
      additionalProperties: false
      properties:
        username: &id005
          type: string
          pattern: ^[a-z][a-z0-9_.-]{2,63}$
        name: &id006
          type: string
          minLength: 1
          maxLength: 120
        role: &id007
          type: string
          enum:
          - DEVELOPER
          - ANALYST
          - ADMIN
    NewPlatformAccount:
      type: object
      required:
      - username
      - name
      - role
      - password
      additionalProperties: false
      properties:
        username: *id005
        name: *id006
        role: *id007
        password:
          type: string
          minLength: 12
          maxLength: 72
          writeOnly: true
          description: Maximum 72 UTF-8 bytes; BCrypt stored, never returned
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
security:
- sessionCookie: []
