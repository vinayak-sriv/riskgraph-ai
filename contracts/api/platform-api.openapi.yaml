openapi: 3.1.0
info:
  title: RiskGraph Platform API
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Platform API is healthy
  /scans:
    post:
      summary: Start a scan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScanRequest"
      responses:
        "202":
          description: Scan accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateScanResponse"
  /scans/{scanId}:
    get:
      summary: Read scan status and result
      parameters:
        - name: scanId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Scan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResult"
  /demo/authorization-removal:
    get:
      summary: Run the canonical authorization-removal mentor demo
      responses:
        "200":
          description: Deterministic graph, risk, and verdict result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoAnalysisResult"
        "502":
          description: Graph risk service is unavailable
components:
  schemas:
    CreateScanRequest:
      type: object
      additionalProperties: false
      required:
        - repository
        - old_commit
        - new_commit
      properties:
        repository:
          type: string
          minLength: 1
        old_commit:
          type: string
          minLength: 7
        new_commit:
          type: string
          minLength: 7
    CreateScanResponse:
      type: object
      additionalProperties: false
      required:
        - scan_id
        - status
      properties:
        scan_id:
          type: string
        status:
          type: string
          enum:
            - PENDING
            - RUNNING
    ScanResult:
      type: object
      additionalProperties: false
      required:
        - scan_id
        - status
        - decision
        - risk_before
        - risk_after
        - risk_delta
        - findings
      properties:
        scan_id:
          type: string
        status:
          type: string
          enum:
            - PENDING
            - RUNNING
            - COMPLETED
            - FAILED
        decision:
          type:
            - string
            - "null"
          enum:
            - ALLOW
            - REVIEW
            - BLOCK
            - null
        risk_before:
          type: integer
          minimum: 0
          maximum: 100
        risk_after:
          type: integer
          minimum: 0
          maximum: 100
        risk_delta:
          type: integer
          minimum: -100
          maximum: 100
        findings:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - type
              - severity
              - description
            properties:
              type:
                type: string
              severity:
                type: string
                enum:
                  - LOW
                  - MODERATE
                  - MEDIUM
                  - HIGH
                  - CRITICAL
                description:
                  type: string
    DemoAnalysisResult:
      type: object
      additionalProperties: false
      required:
        - scenario
        - graph_delta
        - risk_result
        - verdict
      properties:
        scenario:
          type: string
        graph_delta:
          $ref: "../ir/graph-delta.schema.json"
        risk_result:
          $ref: "../ir/risk-result.schema.json"
        verdict:
          type: string
          enum:
            - ALLOW
            - REVIEW
            - BLOCK
