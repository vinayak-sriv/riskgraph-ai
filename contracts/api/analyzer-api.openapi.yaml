openapi: 3.1.0
info:
  title: RiskGraph Java Analyzer API
  version: 0.2.0
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Java analyzer is healthy
  /analyze:
    post:
      summary: Analyze old and new commits and return endpoint IR
      parameters:
        - name: X-RiskGraph-Service-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeRequest"
      responses:
        "200":
          description: Endpoint IR extracted from before and after commits
          content:
            application/json:
              schema:
                $ref: "../ir/analysis-envelope.schema.json"
        "400":
          description: Repository path or commit validation failed
          content:
            application/problem+json:
              schema:
                type: object
                required: [title, status, detail, code]
        "401":
          description: Invalid internal service credential
        "429":
          description: Analyzer capacity is exhausted
        "503":
          description: Internal service authentication is not configured
components:
  schemas:
    AnalyzeRequest:
      type: object
      additionalProperties: false
      required:
        - repository_path
        - old_commit
        - new_commit
      properties:
        repository_path:
          type: string
          minLength: 1
        old_commit:
          type: string
          minLength: 40
          maxLength: 40
          pattern: "^[0-9a-fA-F]{40}$"
        new_commit:
          type: string
          minLength: 40
          maxLength: 40
          pattern: "^[0-9a-fA-F]{40}$"
    EndpointIr:
      $ref: "../ir/endpoint-ir.schema.json"
