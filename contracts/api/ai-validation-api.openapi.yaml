openapi: 3.1.0
info:
  title: RiskGraph AI Validation Service
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /ai/analyze:
    post:
      summary: Analyze
      operationId: analyze_ai_analyze_post
      parameters:
      - name: X-RiskGraph-Service-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Riskgraph-Service-Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Explanation'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /ai/test-suggestion:
    post:
      summary: Test Suggestion
      operationId: test_suggestion_ai_test_suggestion_post
      parameters:
      - name: X-RiskGraph-Service-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Riskgraph-Service-Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Explanation'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /validation/http:
    post:
      summary: Validate Http
      operationId: validate_http_validation_http_post
      parameters:
      - name: X-RiskGraph-Service-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Riskgraph-Service-Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AIAnalysis:
      properties:
        finding:
          type: string
          maxLength: 256
          minLength: 1
          title: Finding
        evidence:
          items:
            type: string
          type: array
          maxItems: 100
          minItems: 1
          title: Evidence
        hypothesis:
          type: string
          maxLength: 2000
          minLength: 1
          title: Hypothesis
        recommended_test:
          type: string
          maxLength: 1000
          minLength: 1
          title: Recommended Test
        confidence:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          title: Confidence
      additionalProperties: false
      type: object
      required:
      - finding
      - evidence
      - hypothesis
      - recommended_test
      - confidence
      title: AIAnalysis
    EvidenceRequest:
      properties:
        evidence:
          items:
            type: string
            maxLength: 2000
          type: array
          maxItems: 100
          minItems: 1
          title: Evidence
        method:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          title: Method
          default: GET
        path:
          type: string
          maxLength: 512
          pattern: ^/[A-Za-z0-9/_{}.-]*$
          title: Path
          default: /admin/export
      additionalProperties: false
      type: object
      required:
      - evidence
      title: EvidenceRequest
    Explanation:
      properties:
        status:
          type: string
          enum:
          - AVAILABLE
          - DEGRADED
          title: Status
        confirmed:
          type: boolean
          const: false
          title: Confirmed
          default: false
        provider:
          type: string
          title: Provider
        reason_code:
          type: string
          title: Reason Code
        analysis:
          $ref: '#/components/schemas/AIAnalysis'
      additionalProperties: false
      type: object
      required:
      - status
      - provider
      - reason_code
      - analysis
      title: Explanation
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ValidationRequest:
      properties:
        sandbox_revision:
          type: string
          enum:
          - protected
          - vulnerable
          title: Sandbox Revision
        expected_commit:
          anyOf:
          - type: string
            pattern: ^[0-9a-f]{40}$
          - type: 'null'
          title: Expected Commit
        method:
          type: string
          const: GET
          title: Method
          default: GET
        path:
          type: string
          const: /admin/export
          title: Path
          default: /admin/export
        headers:
          additionalProperties:
            type: string
          type: object
          maxProperties: 0
          title: Headers
        body:
          type: 'null'
          title: Body
        auth_context:
          type: string
          const: ANONYMOUS
          title: Auth Context
          default: ANONYMOUS
      additionalProperties: false
      type: object
      required:
      - sandbox_revision
      title: ValidationRequest
    ValidationResult:
      properties:
        status:
          type: string
          enum:
          - CONFIRMED
          - REJECTED
          - INCONCLUSIVE
          - NOT_RUN
          - ERROR
          title: Status
        confirmed:
          type: boolean
          title: Confirmed
          default: false
        actual_status:
          anyOf:
          - type: integer
          - type: 'null'
          title: Actual Status
        expected_status:
          type: integer
          title: Expected Status
          default: 200
        evidence:
          items:
            type: string
          type: array
          title: Evidence
        reason_code:
          type: string
          title: Reason Code
        sandbox_revision:
          type: string
          title: Sandbox Revision
        container_image_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Container Image Id
        cleanup_complete:
          type: boolean
          title: Cleanup Complete
          default: true
        response_sha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Response Sha256
        source_commit:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Commit
      additionalProperties: false
      type: object
      required:
      - status
      - reason_code
      - sandbox_revision
      title: ValidationResult
